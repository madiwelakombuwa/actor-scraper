<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Page Dashboard - Mayes for Texas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1877f2;
            --primary-dark: #166fe5;
            --secondary: #42b72a;
            --bg-dark: #18191a;
            --bg-card: #242526;
            --bg-hover: #3a3b3c;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --border: #3e4042;
            --gradient-start: #1877f2;
            --gradient-end: #42b72a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/></svg>');
            background-size: 200px;
            opacity: 0.3;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(24, 119, 242, 0.2);
        }

        .stat-card .icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .stat-card.followers .icon { background: linear-gradient(135deg, #1877f2, #42b72a); }
        .stat-card.likes .icon { background: linear-gradient(135deg, #f02849, #ff6b6b); }
        .stat-card.posts .icon { background: linear-gradient(135deg, #9c27b0, #e040fb); }
        .stat-card.activity .icon { background: linear-gradient(135deg, #ff9800, #ffeb3b); }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Profile Section */
        .profile-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .profile-section {
                grid-template-columns: 1fr;
            }
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            overflow: hidden;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .profile-handle {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .profile-category {
            display: inline-block;
            background: var(--bg-hover);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .info-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .info-card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item .label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            min-width: 100px;
        }

        .info-item .value {
            color: var(--text-primary);
            flex: 1;
        }

        /* Posts Section */
        .posts-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .posts-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .post-item {
            background: var(--bg-hover);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }

        .post-item:hover {
            transform: scale(1.01);
        }

        .post-item:last-child {
            margin-bottom: 0;
        }

        .post-content {
            color: var(--text-primary);
            line-height: 1.7;
        }

        .post-meta {
            margin-top: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .post-engagement {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .engagement-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Screenshot Section */
        .screenshot-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .screenshot-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .screenshot-container {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .screenshot-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Activity Section */
        .activity-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .activity-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .activity-item {
            padding: 15px;
            background: var(--bg-hover);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .activity-item:last-child {
            margin-bottom: 0;
        }

        /* Metadata Section */
        .metadata-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .metadata-section h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .metadata-item {
            background: var(--bg-hover);
            padding: 15px;
            border-radius: 10px;
        }

        .metadata-item .key {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .metadata-item .val {
            color: var(--text-primary);
            word-break: break-all;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error {
            background: #3c1a1a;
            border: 1px solid #f02849;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #ff6b6b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card .value {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Link Styles */
        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .fb-link {
            display: inline-block;
            margin-top: 15px;
            background: var(--primary);
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .fb-link:hover {
            background: var(--primary-dark);
            text-decoration: none;
        }

        /* Raw JSON Section */
        .raw-json {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .raw-json h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .raw-json pre {
            background: var(--bg-dark);
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .toggle-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Facebook Page Dashboard</h1>
            <p>Real-time insights for Mayes for Texas</p>
        </header>

        <div id="dashboard-content">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px;">Loading dashboard data...</p>
            </div>
        </div>

        <footer class="footer">
            <p>Powered by <a href="https://pages.cloudflare.com/" target="_blank">Cloudflare Pages</a> | Data scraped at <span id="scrape-time">--</span></p>
        </footer>
    </div>

    <script>
        async function loadDashboard() {
            const container = document.getElementById('dashboard-content');

            try {
                const response = await fetch('/page-data.json');
                if (!response.ok) throw new Error('Failed to load data');

                const data = await response.json();
                renderDashboard(data);

                // Update footer with scrape time
                if (data.scrapedAt) {
                    document.getElementById('scrape-time').textContent = new Date(data.scrapedAt).toLocaleString();
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        <h3>Unable to load dashboard data</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px;">Make sure to run the scraper first: <code>npm run scrape</code></p>
                    </div>
                `;
            }
        }

        function renderDashboard(data) {
            const container = document.getElementById('dashboard-content');

            const postsCount = data.posts?.length || 0;
            const activityCount = data.recentActivity?.length || 0;

            container.innerHTML = `
                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card followers">
                        <div class="icon">👥</div>
                        <h3>Followers</h3>
                        <div class="value">${data.followers || 'N/A'}</div>
                    </div>
                    <div class="stat-card likes">
                        <div class="icon">❤️</div>
                        <h3>Likes</h3>
                        <div class="value">${data.likes || 'N/A'}</div>
                    </div>
                    <div class="stat-card posts">
                        <div class="icon">📝</div>
                        <h3>Posts Scraped</h3>
                        <div class="value">${postsCount}</div>
                    </div>
                    <div class="stat-card activity">
                        <div class="icon">📊</div>
                        <h3>Activities</h3>
                        <div class="value">${activityCount}</div>
                    </div>
                </div>

                <!-- Profile Section -->
                <div class="profile-section">
                    <div class="profile-card">
                        <div class="profile-image">
                            ${data.profileImage ? `<img src="${data.profileImage}" alt="Profile">` : '👤'}
                        </div>
                        <h2 class="profile-name">${data.pageName || data.metadata?.ogTitle || 'Unknown Page'}</h2>
                        <p class="profile-handle">@${data.pageHandle}</p>
                        ${data.category ? `<span class="profile-category">${data.category}</span>` : ''}
                        <a href="${data.url}" target="_blank" class="fb-link">View on Facebook</a>
                    </div>
                    <div class="info-card">
                        <h2>📋 Page Information</h2>
                        <div class="info-item">
                            <span class="label">URL</span>
                            <span class="value"><a href="${data.url}" target="_blank">${data.url}</a></span>
                        </div>
                        <div class="info-item">
                            <span class="label">Description</span>
                            <span class="value">${data.description || data.metadata?.ogDescription || 'No description available'}</span>
                        </div>
                        ${data.contactInfo?.website ? `
                        <div class="info-item">
                            <span class="label">Website</span>
                            <span class="value"><a href="${data.contactInfo.website}" target="_blank">${data.contactInfo.website}</a></span>
                        </div>
                        ` : ''}
                        ${data.contactInfo?.email ? `
                        <div class="info-item">
                            <span class="label">Email</span>
                            <span class="value">${data.contactInfo.email}</span>
                        </div>
                        ` : ''}
                        ${data.about ? `
                        <div class="info-item">
                            <span class="label">About</span>
                            <span class="value">${data.about}</span>
                        </div>
                        ` : ''}
                    </div>
                </div>

                <!-- Screenshot Section -->
                <div class="screenshot-section">
                    <h2>📸 Page Screenshot</h2>
                    <div class="screenshot-container">
                        <img src="/screenshot.png" alt="Facebook Page Screenshot" onerror="this.parentElement.innerHTML='<p style=\\'padding:20px;text-align:center;color:var(--text-secondary)\\'>Screenshot not available</p>'">
                    </div>
                </div>

                <!-- Posts Section -->
                ${postsCount > 0 ? `
                <div class="posts-section">
                    <h2>📝 Recent Posts</h2>
                    ${data.posts.map(post => `
                        <div class="post-item">
                            <div class="post-content">${post.content || 'No content'}</div>
                            <div class="post-engagement">
                                ${post.likes !== undefined ? `<span class="engagement-stat">❤️ ${post.likes}</span>` : ''}
                                ${post.comments !== undefined ? `<span class="engagement-stat">💬 ${post.comments}</span>` : ''}
                                ${post.shares !== undefined ? `<span class="engagement-stat">🔄 ${post.shares}</span>` : ''}
                            </div>
                            <div class="post-meta">
                                ${post.date ? `Posted: ${new Date(post.date).toLocaleDateString()} | ` : ''}
                                Captured at ${new Date(post.scrapedAt).toLocaleString()}
                                ${post.url ? ` | <a href="${post.url}" target="_blank">View Post</a>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                <!-- Activity Section -->
                ${activityCount > 0 ? `
                <div class="activity-section">
                    <h2>📊 Recent Activity</h2>
                    ${data.recentActivity.map(activity => `
                        <div class="activity-item">
                            <div>${activity.content}</div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                <!-- Metadata Section -->
                ${Object.keys(data.metadata || {}).length > 0 ? `
                <div class="metadata-section">
                    <h2>🔍 Meta Information</h2>
                    <div class="metadata-grid">
                        ${Object.entries(data.metadata).map(([key, value]) => `
                            <div class="metadata-item">
                                <div class="key">${key}</div>
                                <div class="val">${value || 'N/A'}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <!-- Raw JSON -->
                <div class="raw-json">
                    <h2>
                        <span>🗂 Raw Data</span>
                        <button class="toggle-btn" onclick="toggleRawJson()">Toggle</button>
                    </h2>
                    <pre id="raw-json-content" style="display: none;">${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }

        function toggleRawJson() {
            const content = document.getElementById('raw-json-content');
            content.style.display = content.style.display === 'none' ? 'block' : 'none';
        }

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>
</html>
